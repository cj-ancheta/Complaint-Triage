name: Retention checkpoint

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check governed deadline without local data
        run: PYTHONPATH=src python -m complaint_triage.retention_checkpoint --fail-on due_soon

