name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_IMAGE: complaint-triage-postgres:ci

jobs:
  standard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: complaint_triage
      POSTGRES_USER: complaint_triage
      POSTGRES_PASSWORD: ci-disposable-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 55432
      RUN_POSTGRES_TESTS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and start hardened PostgreSQL
        run: |
          docker build --tag "$POSTGRES_IMAGE" docker/postgres
          docker run --detach --name complaint-triage-postgres \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_DB --env POSTGRES_USER --env POSTGRES_PASSWORD \
            --health-cmd "pg_isready -U complaint_triage -d complaint_triage" \
            --health-interval 2s --health-timeout 3s --health-retries 15 \
            "$POSTGRES_IMAGE"
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' complaint-triage-postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs complaint-triage-postgres
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements/locks/bootstrap.lock.txt
            requirements/locks/standard-py313-linux-x86_64.lock.txt
            requirements/locks/audit-tool-py313-linux-x86_64.lock.txt

      - name: Install locked dependencies and audit tooling
        run: |
          python -m pip install --require-hashes -r requirements/locks/bootstrap.lock.txt
          python -m pip install --require-hashes -r requirements/locks/standard-py313-linux-x86_64.lock.txt
          python -m pip install --require-hashes -r requirements/locks/audit-tool-py313-linux-x86_64.lock.txt
          python -m pip check

      - name: Audit dependencies and validate SBOM
        run: |
          python -m pip_audit --local --strict
          python -m pip_audit --local --format cyclonedx-json --output sbom-standard.cdx.json
          python -c "import json,pathlib; f=pathlib.Path('sbom-standard.cdx.json'); raw=f.read_text(); p=json.loads(raw); assert p['bomFormat']=='CycloneDX' and p['components']; assert '/home/runner' not in raw and 'POSTGRES_PASSWORD' not in raw"

      - name: Install reviewed project source
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Test standard stack
        run: python -m pytest --cov=complaint_triage --cov-report=term-missing --cov-report=xml:coverage-standard.xml

  transformer-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: complaint_triage
      POSTGRES_USER: complaint_triage
      POSTGRES_PASSWORD: ci-disposable-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 55432
      RUN_POSTGRES_TESTS: "1"
      CT_REQUIRE_CPU_TRANSFORMER: "1"
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and start hardened PostgreSQL
        run: |
          docker build --tag "$POSTGRES_IMAGE" docker/postgres
          docker run --detach --name complaint-triage-postgres \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_DB --env POSTGRES_USER --env POSTGRES_PASSWORD \
            --health-cmd "pg_isready -U complaint_triage -d complaint_triage" \
            --health-interval 2s --health-timeout 3s --health-retries 15 \
            "$POSTGRES_IMAGE"
          for attempt in {1..30}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' complaint-triage-postgres)" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs complaint-triage-postgres
          exit 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/locks/bootstrap.lock.txt
            requirements/locks/transformer-py312-linux-x86_64.lock.txt
            requirements/locks/torch-cpu-py312-linux-x86_64.lock.txt
            requirements/locks/audit-tool-py312-linux-x86_64.lock.txt

      - name: Install locked transformer dependencies and audit tooling
        run: |
          python -m pip install --require-hashes -r requirements/locks/bootstrap.lock.txt
          python -m pip install --require-hashes -r requirements/locks/transformer-py312-linux-x86_64.lock.txt
          python -m pip install --require-hashes -r requirements/locks/audit-tool-py312-linux-x86_64.lock.txt
          python -m pip check

      - name: Strictly audit PyPI dependencies
        run: python -m pip_audit --local --strict

      - name: Install locked CPU wheel and validate SBOM
        run: |
          python -m pip install --require-hashes --no-deps -r requirements/locks/torch-cpu-py312-linux-x86_64.lock.txt
          python -m pip check
          python -m pip_audit --local --format cyclonedx-json --output sbom-transformer.cdx.json
          PYTHONPATH=src python -m complaint_triage.supply_chain sbom-transformer.cdx.json
          python -c "import json,pathlib; f=pathlib.Path('sbom-transformer.cdx.json'); raw=f.read_text(); p=json.loads(raw); names={c.get('name') for c in p['components']}; assert p['bomFormat']=='CycloneDX' and 'torch' in names; assert '/home/runner' not in raw and 'POSTGRES_PASSWORD' not in raw"

      - name: Install reviewed project source
        run: |
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Verify locked CPU transformer stack
        run: python -m pytest tests/test_transformer_cpu_ci.py -q

      - name: Test transformer stack without GPU acceptance
        run: python -m pytest -m "not gpu" --cov=complaint_triage --cov-report=term-missing --cov-report=xml:coverage-transformer.xml

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: |
          docker run --rm --volume "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner

      - name: Prove secret scanner rejects a redacted fixture
        run: |
          fixture_dir="$(mktemp -d)"
          printf '%s%s\n' 'CT_QA_SECRET_' '7M4K9P2Q8R5T1V6W3X0Y7Z4A9B2C8D5E' > "$fixture_dir/fixture.txt"
          set +e
          docker run --rm --volume "$fixture_dir:/scan:ro" --volume "$PWD/.gitleaks.toml:/config.toml:ro" \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            dir /scan --config /config.toml --redact --no-banner >/dev/null 2>&1
          scanner_status=$?
          set -e
          test "$scanner_status" -eq 1

      - name: Build hardened PostgreSQL image
        run: docker build --tag "$POSTGRES_IMAGE" docker/postgres

      - name: Scan PostgreSQL image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: complaint-triage-postgres:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
          format: table
          version: v0.70.0
