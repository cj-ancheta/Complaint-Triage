vulnerabilities:
  # The pinned upstream gosu binary is used only for local UID/GID switching by
  # the PostgreSQL entrypoint. It does not exercise TLS, HTTP, URL, mail, or
  # filesystem-root APIs implicated by these Go stdlib findings. Recheck for an
  # upstream gosu/PostgreSQL rebuild before this short exception expires.
