<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="670" viewBox="0 0 1280 670" role="img">
<title>Prospective causal DAG for AI-assisted complaint triage</title>
<desc>Randomized suggestion access affects reviewer response, route correctness, and review time, with baseline case, reviewer, and calendar factors shown explicitly.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="35.0" y="40.0" font-size="24" font-family="Arial, sans-serif" fill="#111827" font-weight="bold">F7. Prospective causal DAG for AI-assisted complaint triage</text>
<text x="35.0" y="68.0" font-size="14" font-family="Arial, sans-serif" fill="#D55E00" >Design blueprint only; no causal effect has been estimated</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6B7280"/></marker></defs>
<rect x="40" y="130" width="230" height="78" rx="10" fill="#E8F4FA" stroke="#0072B2" stroke-width="2"/>
<text x="155.0" y="161.0" font-size="15" font-family="Arial, sans-serif" fill="#111827" text-anchor="middle" font-weight="bold">Randomized assignment A</text>
<text x="155.0" y="186.0" font-size="12" font-family="Arial, sans-serif" fill="#6B7280" text-anchor="middle">manual-only vs suggestion</text>
<rect x="355" y="130" width="230" height="78" rx="10" fill="#E8F4FA" stroke="#0072B2" stroke-width="2"/>
<text x="470.0" y="161.0" font-size="15" font-family="Arial, sans-serif" fill="#111827" text-anchor="middle" font-weight="bold">Suggestion exposure S</text>
<text x="470.0" y="186.0" font-size="12" font-family="Arial, sans-serif" fill="#6B7280" text-anchor="middle">visible, missing, or failed</text>
<rect x="690" y="130" width="230" height="78" rx="10" fill="#FFF4E6" stroke="#D55E00" stroke-width="2"/>
<text x="805.0" y="161.0" font-size="15" font-family="Arial, sans-serif" fill="#111827" text-anchor="middle" font-weight="bold">Reviewer response M</text>
<text x="805.0" y="186.0" font-size="12" font-family="Arial, sans-serif" fill="#6B7280" text-anchor="middle">accept, correct, escalate</text>
<rect x="1030" y="95" width="220" height="78" rx="10" fill="#E8F7F1" stroke="#009E73" stroke-width="2"/>
<text x="1140.0" y="126.0" font-size="15" font-family="Arial, sans-serif" fill="#111827" text-anchor="middle" font-weight="bold">Correct final route Y</text>
<text x="1140.0" y="151.0" font-size="12" font-family="Arial, sans-serif" fill="#6B7280" text-anchor="middle">independent adjudication</text>
<rect x="1030" y="205" width="220" height="78" rx="10" fill="#E8F7F1" stroke="#009E73" stroke-width="2"/>
<text x="1140.0" y="236.0" font-size="15" font-family="Arial, sans-serif" fill="#111827" text-anchor="middle" font-weight="bold">Active review time T</text>
<text x="1140.0" y="261.0" font-size="12" font-family="Arial, sans-serif" fill="#6B7280" text-anchor="middle">queue delay excluded</text>
<rect x="170" y="390" width="230" height="78" rx="10" fill="#F3F4F6" stroke="#1B365D" stroke-width="2"/>
<text x="285.0" y="421.0" font-size="15" font-family="Arial, sans-serif" fill="#111827" text-anchor="middle" font-weight="bold">Case factors C</text>
<text x="285.0" y="446.0" font-size="12" font-family="Arial, sans-serif" fill="#6B7280" text-anchor="middle">true route and complexity</text>
<rect x="525" y="390" width="230" height="78" rx="10" fill="#F3F4F6" stroke="#1B365D" stroke-width="2"/>
<text x="640.0" y="421.0" font-size="15" font-family="Arial, sans-serif" fill="#111827" text-anchor="middle" font-weight="bold">Reviewer factors E</text>
<text x="640.0" y="446.0" font-size="12" font-family="Arial, sans-serif" fill="#6B7280" text-anchor="middle">experience and workload</text>
<rect x="870" y="390" width="245" height="78" rx="10" fill="#F3F4F6" stroke="#1B365D" stroke-width="2"/>
<text x="992.5" y="421.0" font-size="15" font-family="Arial, sans-serif" fill="#111827" text-anchor="middle" font-weight="bold">Calendar/team block W</text>
<text x="992.5" y="446.0" font-size="12" font-family="Arial, sans-serif" fill="#6B7280" text-anchor="middle">case mix and queue context</text>
<line x1="270" y1="169" x2="355" y2="169" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="585" y1="169" x2="690" y2="169" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="920" y1="153" x2="1030" y2="134" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="920" y1="185" x2="1030" y2="237" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="400" y1="390" x2="440" y2="208" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="400" y1="429" x2="690" y2="208" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="400" y1="430" x2="1030" y2="144" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="755" y1="390" x2="790" y2="208" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="755" y1="430" x2="1030" y2="244" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="995" y1="390" x2="1080" y2="283" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="995" y1="390" x2="1135" y2="173" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="930" y1="390" x2="270" y2="208" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="35.0" y="535.0" font-size="17" font-family="Arial, sans-serif" fill="#111827" font-weight="bold">Interpretation</text>
<text x="35.0" y="565.0" font-size="14" font-family="Arial, sans-serif" fill="#111827" >Solid arrows are hypothesized causal paths; the dashed arrow marks stratified assignment by calendar/team block.</text>
<text x="35.0" y="594.0" font-size="14" font-family="Arial, sans-serif" fill="#D55E00" >M is post-assignment: do not adjust for acceptance or override in the primary intention-to-treat total-effect analysis.</text>
<text x="35.0" y="623.0" font-size="14" font-family="Arial, sans-serif" fill="#6B7280" >Randomization addresses assignment confounding in expectation; interference, attrition, and outcome validity still require design controls.</text>
</svg>
